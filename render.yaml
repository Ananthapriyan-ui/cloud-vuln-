services:
  - type: web
    name: cloudvuln-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && gunicorn -c gunicorn.conf.py main:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: 8000
      - key: BIND
        value: 0.0.0.0:8000
      - key: SECRET_KEY
        generateValue: true
      - key: REFRESH_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://miniproject.vercel.app,https://cloudvuln-frontend.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      # ── Supabase PostgreSQL (PRIMARY DATABASE) ──────────────────
      # Set DATABASE_URL in Render Dashboard → Environment (keep secret, do NOT hardcode here)
      # Format: postgresql://postgres.[ref]:[password]@[host]:6543/postgres
      - key: DATABASE_URL
        sync: false   # must be set manually in Render Dashboard
      # ── Supabase Storage (for report uploads) ───────────────────
      - key: SUPABASE_URL
        sync: false   # must be set manually in Render Dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false   # must be set manually in Render Dashboard
      - key: SUPABASE_STORAGE_BUCKET
        value: reports
